# CircuitScope CI.
#
# NOTE (Stage 6): this workflow has never run - there is no remote to push to.
# Every `run:` command was executed locally (see docs/FINAL_V2_ACCEPTANCE.md
# for the exact local results), the YAML syntax was machine-checked, and the
# first push must be followed by the "first push check" in docs/HUMAN_TASKS.md
# (confirm every job is green on the runner and fix what it exposes).
#
# Jobs:
# - frontend:      lint + unit tests + production build (every push/PR)
# - backend-fast:  pytest -m "not model" + link check + claims-ledger check
#                  (every push/PR)
# - backend-model: full pytest incl. the real-model tests; needs the GPT-2
#                  download, so it runs on workflow_dispatch and the weekly
#                  schedule only
# - e2e:           Playwright against the real stack; Windows runner because
#                  frontend/playwright.config.ts launches .venv\Scripts\python;
#                  manual workflow_dispatch only
#
# No secrets are needed or used: the app is local-first and makes no network
# calls from app code.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 03:00 UTC: refreshes the full model test run.
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (lint, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      # Two oxlint warnings are documented as intentional (Stage 1 lint
      # decisions in docs/V2_PROGRESS.md); oxlint exits 0 on warnings.
      - name: Lint (oxlint)
        run: npx oxlint
        working-directory: frontend
      - name: Unit tests (Vitest)
        run: npx vitest run
        working-directory: frontend
      - name: Production build
        run: npm run build
        working-directory: frontend

  backend-fast:
    name: backend fast tests + link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # requirements.txt pins torch==2.15.0; on Linux the default wheel is the
      # large CUDA build, so install the CPU wheel first (same version) and
      # let pip treat the rest of requirements.txt as already satisfied.
      - name: Install Python dependencies (CPU torch)
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Fast backend tests (no model download needed)
        run: pytest backend/tests -m "not model" -q
      - name: Check documentation links
        run: python scripts/check_links.py
      - name: Check the claims ledger against the stored results
        run: python scripts/check_claims.py

  backend-model:
    name: backend full tests (real model)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache Hugging Face hub (GPT-2 weights)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-gpt2
      - name: Install Python dependencies (CPU torch)
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Download the model weights
        run: python scripts/download_model.py
      - name: Full backend test suite
        run: pytest backend/tests -q

  e2e:
    name: e2e (Playwright, real stack)
    runs-on: windows-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache Hugging Face hub (GPT-2 weights)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hub-gpt2
      - name: Create the project venv (Playwright launches .venv\Scripts\python)
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install the Playwright browser
        run: npx playwright install chromium
        working-directory: frontend
      - name: Run e2e tests
        run: npx playwright test --reporter=list
        working-directory: frontend
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
